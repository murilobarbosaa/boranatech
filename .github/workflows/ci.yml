# CI do Bora na Tech

# Dois jobs de proposito:
#
#   qualidade  - offline (tsc, geradores em modo --check, hashes de CSP, testes).
#                Roda em todo push e PR, nao precisa de segredo nenhum.
#
#   migrations - compara as tabelas declaradas em supabase/migrations com as que
#                existem no banco alvo. Precisa de rede e do service role.
#
# Por que o job de migrations existe: a migration
# 20260710120000_create_linkedin_improvement_progress.sql ficou no repositorio
# sem nunca ser aplicada, o codigo subiu, e o checklist de melhorias do
# Analisador de LinkedIn nasceu morto em producao devolvendo 500. O passo (4)
# do checklist de deploy (CLAUDE.md) foi criado para pegar isso, mas um passo
# que depende de alguem lembrar de rodar repete o desenho que falhou. Aqui ele
# roda sozinho.
name: CI

# Dispara em push de QUALQUER branch, nao so main.
#
# Por que mudou: com o gatilho restrito a main, nao havia como confirmar o CI
# verde ANTES de tocar em producao, a nao ser abrindo PR. Num repositorio de uma
# pessoa so, a cerimonia de PR nao paga o que cobra, e o efeito era o inverso do
# desejado: o CI validava depois do fato.
#
# Rodar `migrations` em toda branch e seguro porque ele e LEITURA PURA: faz GET
# no PostgREST e le o OpenAPI, nao escreve nada, nao chama RPC volatil (a
# existencia de funcao e conferida pelo OpenAPI justamente para nao invocar
# `reserve_ai_usage_slot`, que insere linha). Ver docs/limites-do-guard-de-migrations.md.
on:
  push:
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SEM `with: version`. O `packageManager` do package.json (pnpm@10.33.2)
      # e a fonte unica, e o action-setup@v4 RECUSA quando encontra as duas
      # ("Multiple versions of pnpm specified"). Deixar o packageManager mandar
      # tambem da paridade exata entre CI e maquina local, em vez de "alguma 10".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Geradores em modo --check: o arquivo gerado no disco tem que ser byte a
      # byte o que a fonte produz hoje. Passo PROPRIO, e nao dentro do `pnpm
      # check`, porque o hook de pre-commit chama `pnpm check` e nao chama este:
      # quem pega um gerado desatualizado e o CI (e o `pnpm check:all` local),
      # nao o hook. Os dois geradores sao deterministicos (leem arrays
      # estaticos, sem relogio nem ordem instavel), entao a comparacao byte a
      # byte nunca acusa por conta propria.
      - run: pnpm check:generated
      # Typecheck dos scripts (guards e utilitarios). Roda AQUI e nao no hook
      # de pre-commit por escolha deliberada: e um `tsc` separado, com o
      # `target` proprio dos `.mts`, e o hook ja e o gate mais caro do fluxo.
      # Motivo de existir: `scripts/` ficava fora do `include` do
      # tsconfig.json, e em 2026-08-01 o checkMigrationsApplied.mts subiu com
      # um ReferenceError com o `pnpm check` verde.
      - run: pnpm check:scripts
      # Auditoria de escopo dos limiares numericos do Analisador de LinkedIn:
      # todo sitio numerico classificado, e toda ancora de mutante casando com
      # a fonte. NAO roda as mutacoes (aquilo leva 10+ min, uma suite por
      # mutante); so a parte que cabe num gate, que leva menos de 1s.
      # Motivo: o script ficou FORA de qualquer gate e abortava na arvore limpa
      # havia semanas, com 6 sitios orfaos, 3 deles criados pela auditoria.
      - run: pnpm check:limiares
      - run: pnpm test

  migrations:
    runs-on: ubuntu-latest
    # Nao bloqueia o merge de PR de fork (que nao enxerga segredo), mas falha
    # visivelmente no push para main, que e quando a migration deveria ter sido
    # aplicada.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      # SEM `with: version`. O `packageManager` do package.json (pnpm@10.33.2)
      # e a fonte unica, e o action-setup@v4 RECUSA quando encontra as duas
      # ("Multiple versions of pnpm specified"). Deixar o packageManager mandar
      # tambem da paridade exata entre CI e maquina local, em vez de "alguma 10".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A chave ANON e obrigatoria: sem ela o guard nao consegue verificar RLS,
      # e guard de seguranca que pula em silencio e a forma exata do problema
      # que abriu esta auditoria. O script falha por conta propria quando ela
      # falta (ver CHECK_RLS_OBRIGATORIO).
      - name: Objetos declarados existem no banco alvo, e RLS esta ativa
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          CHECK_RLS_OBRIGATORIO: "1"
        run: pnpm check:migrations

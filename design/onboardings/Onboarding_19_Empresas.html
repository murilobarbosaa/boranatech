<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDF4DA">
<meta name="color-scheme" content="light">
<meta name="description" content="Onboarding da página de Empresas do Bora na Tech?">
<title>Onboarding Empresas | Bora na Tech?</title>

<!--
  ============================================================================
  BORA NA TECH?: ONBOARDING EMPRESAS          (estilo "card de stories")
  Arquivo único, sem dependências externas. Abre direto no navegador.

  ESTILO: cada card é um story. Fundo chapado saturado, grade de linhas,
  ícones fantasma, placa amarela rotacionada no título, pill escura com texto
  amarelo, divisória tracejada e rodapé "Sua bússola na TI".

  COMO PLUGAR NO APP
  ------------------
  1. Todo o conteúdo vive no array STEPS (bloco 4). O resto é motor.
  2. Saída:
       window.addEventListener('bnt:onboarding', e => console.log(e.detail));
     Eventos: 'step', 'choice', 'finish'. O 'finish' traz { completed, perfil, tour }.
  3. Controle externo: window.BNTOnboarding.next() / .prev() / .goTo(n)
     / .restart() / .step / .total / .data
  4. Na função finish() troque o console.log pela navegação real.

  Sem localStorage por decisão de projeto. O estado sai por evento.
  ============================================================================
-->

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --cream:#FDF4DA;
  --yel:#FCC700;
  --gold:#E7A400;
  --navy:#0B1020;
  --ink:#171426;
  --mut:#5F5D72;

  /* fundos de story */
  --s-blue:#1D4ED8;
  --s-pink:#F25CA2;
  --s-indigo:#1E1B4B;
  --s-red:#E5252F;
  --s-green:#15803D;
  --s-purple:#6D28D9;

  --r-card:26px;
  --r-md:14px;
  --r-sm:11px;
  --bw:2px;
  --ease:cubic-bezier(.2,.75,.2,1);
  --dur:.42s;
  --card-w:min(94vw,420px);
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;min-height:100dvh;
  font-family:"Segoe UI",system-ui,-apple-system,Inter,Roboto,Arial,sans-serif;
  background:var(--cream);color:var(--ink);overflow-x:hidden;
}

/* fundo da página ----------------------------------------- */
.dots-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(11,16,32,.10) 1.4px,transparent 1.4px);
  background-size:22px 22px;
}
.bgicons{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bgicons>span{position:absolute;opacity:.16;animation:float 9s var(--ease) infinite alternate;}
@keyframes float{from{transform:translateY(0) rotate(var(--rot,0deg));}to{transform:translateY(-14px) rotate(var(--rot,0deg));}}

.stage{
  position:relative;z-index:1;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(14px,3.2vw,30px);
  padding-top:max(clamp(14px,3.2vw,30px),env(safe-area-inset-top));
  padding-bottom:max(clamp(14px,3.2vw,30px),env(safe-area-inset-bottom));
}
.modal{position:relative;width:var(--card-w);}

/* barra de progresso -------------------------------------- */
.bar{
  height:10px;border:var(--bw) solid var(--navy);border-radius:99px;
  background:#fff;overflow:hidden;box-shadow:2px 2px 0 var(--navy);margin-bottom:14px;
}
.bar>i{display:block;height:100%;width:0;background:var(--yel);
  border-right:var(--bw) solid var(--navy);transition:width .45s var(--ease);}

/* ============================================================
   PILHA + CARD (o "story")
   ============================================================ */
.stack{position:relative;height:600px;transition:height var(--dur) var(--ease);touch-action:pan-y;}

.card{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:var(--bg,#1D4ED8);
  border:3px solid var(--navy);
  border-radius:var(--r-card);
  overflow:hidden;
  box-shadow:9px 11px 0 var(--navy);
  pointer-events:none;opacity:0;
  transform:translateY(34px) scale(.9);
  transition:transform var(--dur) var(--ease),opacity .34s linear;
  will-change:transform,opacity;
  display:flex;flex-direction:column;
}
.card.front{bottom:auto;height:auto;transform:none;opacity:1;z-index:5;pointer-events:auto;}
.card.b1{transform:translateY(14px) scale(.955);opacity:.97;z-index:4;}
.card.b2{transform:translateY(26px) scale(.912);opacity:.9;z-index:3;}
.card.gone{transform:translateX(-128%) rotate(-8deg);opacity:0;z-index:6;}
.card.dragging{transition:none;}

/* grade + fantasmas + brilhos ----------------------------- */
.gridbg{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);
  background-size:26px 26px;
}
.ghosts{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.ghosts span{position:absolute;opacity:.13;color:#fff;}
.sparks{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
.sparks span{position:absolute;line-height:0;}

/* topo ---------------------------------------------------- */
.top{
  position:relative;z-index:3;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:14px 15px 0;
}
.brandbit{display:flex;align-items:center;gap:8px;min-width:0;}
.brandbit img,.sig img,.hero img{display:block;}
.tagpill{
  background:var(--yel);color:var(--navy);
  border:var(--bw) solid var(--navy);border-radius:20px;
  font-size:10.5px;font-weight:800;letter-spacing:.6px;
  padding:5px 10px;box-shadow:3px 3px 0 var(--navy);
  transform:rotate(-1deg);white-space:nowrap;
}
.steppill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--yel);color:var(--navy);
  border:var(--bw) solid var(--navy);border-radius:20px;
  font-size:10px;font-weight:800;letter-spacing:.6px;
  padding:5px 10px 5px 5px;box-shadow:3px 3px 0 var(--navy);white-space:nowrap;
}
.steppill i{
  width:15px;height:15px;border-radius:50%;background:var(--navy);
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 15px;
}

/* miolo --------------------------------------------------- */
.inner{
  position:relative;z-index:3;flex:1;
  padding:16px 20px 10px;text-align:center;
}

.eyebrow{
  margin:0 0 9px;color:rgba(255,255,255,.88);
  font-size:10px;font-weight:800;letter-spacing:3.2px;text-transform:uppercase;
}

.plaque{
  display:inline-block;margin:0 0 4px;
  background:var(--yel);color:var(--navy);
  border:3px solid var(--navy);border-radius:18px;
  padding:9px 17px;box-shadow:7px 8px 0 var(--navy);
  font-size:21px;font-weight:800;line-height:1.22;letter-spacing:-.3px;
  transform:rotate(-1.4deg);
}

/* herói: círculo tracejado -------------------------------- */
.hero{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  margin:20px 0 4px;
}
.hero .ring{
  width:var(--hs,96px);height:var(--hs,96px);border-radius:50%;
  background:rgba(255,255,255,.14);
  border:3px dashed rgba(255,255,255,.95);
  display:flex;align-items:center;justify-content:center;
  box-shadow:5px 6px 0 rgba(11,16,32,.45);
}
.hero .coin{filter:drop-shadow(4px 5px 0 rgba(11,16,32,.45));}

.lead{
  margin:14px 0 0;color:#fff;
  font-size:14.5px;line-height:1.52;font-weight:600;
  text-shadow:0 1px 0 rgba(11,16,32,.12);
}

/* pill escura com texto amarelo (assinatura da marca) ------ */
.punch{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:15px;background:var(--navy);color:var(--yel);
  border-radius:22px;padding:9px 16px;
  font-size:12.5px;font-weight:800;line-height:1.3;
  box-shadow:4px 5px 0 rgba(11,16,32,.35);text-align:left;
}

/* chips ---------------------------------------------------- */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px;justify-content:center;}
.chip{
  background:#fff;color:var(--ink);
  border:var(--bw) solid var(--navy);border-radius:20px;
  padding:5px 11px;font-size:11.5px;font-weight:800;
  box-shadow:2px 2px 0 var(--navy);white-space:nowrap;
}

/* lista de pontos ------------------------------------------ */
.points{list-style:none;padding:0;margin:16px 0 0;text-align:left;}
.points li{display:flex;gap:11px;align-items:flex-start;margin:11px 0;transition:opacity .3s;}
.points .s{
  width:38px;height:38px;flex:0 0 38px;background:var(--yel);
  border:var(--bw) solid var(--navy);border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
  box-shadow:2px 3px 0 var(--navy);
}
.points .pt{display:block;font-size:14.5px;font-weight:800;color:#fff;line-height:1.35;}
.points .pt .tag{
  display:inline-block;vertical-align:2px;margin-left:6px;font-weight:800;
  background:var(--yel);color:var(--navy);
  border:1.5px solid var(--navy);border-radius:20px;
  font-size:9px;letter-spacing:.5px;padding:2px 7px;box-shadow:1.5px 1.5px 0 var(--navy);
}
.points .pt .tag[hidden]{display:none;}
.points p{margin:2px 0 0;font-size:12.6px;line-height:1.45;color:rgba(255,255,255,.8);}
.points p strong{color:#fff;font-weight:800;}

/* grade de ferramentas ------------------------------------- */
.grid{display:grid;gap:8px;margin-top:15px;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));}
.tool{
  position:relative;background:#fff;
  border:var(--bw) solid var(--navy);border-radius:var(--r-sm);
  padding:10px 6px 9px;box-shadow:2px 3px 0 var(--navy);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  min-height:70px;
}
.tool span{font-size:10.6px;font-weight:800;line-height:1.22;color:var(--ink);}
.tool .pro{
  position:absolute;top:-2px;right:-2px;
  background:var(--navy);color:var(--yel);font-size:8px;font-weight:800;
  letter-spacing:.5px;line-height:1;padding:3px 6px;border-radius:0 var(--r-sm) 0 8px;
}

/* números --------------------------------------------------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:15px;}
.stat{
  background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.55);
  border-radius:var(--r-md);padding:11px 12px;text-align:left;
}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1;color:var(--yel);letter-spacing:-.6px;}
.stat span{display:block;margin-top:4px;font-size:11.5px;line-height:1.3;color:#fff;font-weight:600;}

/* preço ------------------------------------------------------ */
.price{
  margin-top:15px;background:var(--yel);color:var(--navy);
  border:3px solid var(--navy);border-radius:var(--r-md);
  padding:11px 14px;box-shadow:5px 6px 0 rgba(11,16,32,.4);
  display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;
}
.price b{display:block;font-size:15px;font-weight:800;line-height:1.25;}
.price span{display:block;margin-top:2px;font-size:11.5px;line-height:1.35;opacity:.78;}
.price svg{flex:0 0 auto;}

/* opções (escolhas) ------------------------------------------ */
.opts{margin-top:16px;display:flex;flex-direction:column;gap:9px;text-align:left;}
.opt{
  display:flex;gap:12px;align-items:center;width:100%;text-align:left;
  background:#fff;border:var(--bw) solid var(--navy);border-radius:var(--r-md);
  padding:11px 13px;box-shadow:4px 5px 0 var(--navy);cursor:pointer;font:inherit;color:inherit;
  transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .12s linear;
}
.opt:hover{transform:translate(-1px,-1px);box-shadow:6px 7px 0 var(--navy);}
.opt:active{transform:translate(2px,2px);box-shadow:2px 3px 0 var(--navy);}
.opt[aria-checked="true"]{background:var(--yel);}
.opt .oic{
  width:40px;height:40px;flex:0 0 40px;background:var(--yel);
  border:var(--bw) solid var(--navy);border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;
}
.opt[aria-checked="true"] .oic{background:#fff;}
.opt b{display:block;font-size:14.5px;font-weight:800;color:var(--ink);line-height:1.25;}
.opt em{display:block;font-style:normal;font-size:12px;color:var(--mut);margin-top:1px;}

/* botão de assinatura Pro, com brilho que varre e estrelas piscando */
.proglow{position:relative;display:inline-block;margin-top:17px;}
.proglow > i{position:absolute;pointer-events:none;line-height:0;animation:twinkle 1.9s ease-in-out infinite;}
.proglow > i.s1{top:-11px;left:-13px;animation-delay:0s;}
.proglow > i.s2{top:-7px;right:-11px;animation-delay:.45s;}
.proglow > i.s3{bottom:-10px;right:14px;animation-delay:.9s;}
.proglow > i.s4{bottom:-8px;left:16px;animation-delay:1.35s;}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6) rotate(0deg);}50%{opacity:1;transform:scale(1.2) rotate(30deg);}}

.procta{
  position:relative;display:inline-flex;align-items:center;gap:9px;
  background:var(--yel);color:var(--navy);text-decoration:none;
  border:3px solid var(--navy);border-radius:16px;
  padding:12px 22px;font-size:15px;font-weight:800;letter-spacing:.1px;
  box-shadow:6px 7px 0 var(--navy);overflow:hidden;
  transition:transform .1s var(--ease),box-shadow .1s var(--ease);
}
.procta:hover{transform:translate(-1px,-1px);box-shadow:8px 9px 0 var(--navy);}
.procta:active{transform:translate(3px,4px);box-shadow:3px 3px 0 var(--navy);}
.procta > span{position:relative;z-index:1;display:inline-flex;align-items:center;}
.procta::after{
  content:"";position:absolute;top:-60%;bottom:-60%;left:-70%;width:42%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.92),transparent);
  transform:skewX(-18deg);animation:sweep 2.8s ease-in-out infinite;
}
@keyframes sweep{0%{left:-70%;}55%,100%{left:135%;}}

/* rodapé do card --------------------------------------------- */
.cardfoot{position:relative;z-index:3;padding:0 20px 15px;}
.dash{
  display:flex;align-items:center;gap:8px;margin:6px 0 11px;
}
.dash i{flex:1;height:0;border-top:1.5px dashed rgba(255,255,255,.42);}
.sig{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.sig .who{display:flex;align-items:center;gap:8px;min-width:0;}
.sig .who b{font-size:12.5px;font-weight:800;color:#fff;letter-spacing:.2px;white-space:nowrap;}
.sig .slog{
  background:#fff;color:var(--navy);border:var(--bw) solid var(--navy);
  border-radius:20px;padding:5px 12px;font-size:11px;font-weight:800;
  box-shadow:2px 3px 0 rgba(11,16,32,.4);white-space:nowrap;
}

/* controles fora do card -------------------------------------- */
.foot{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.side{display:flex;align-items:center;gap:2px;min-width:0;}
.ghost{
  background:none;border:none;font:inherit;font-weight:700;font-size:13.5px;
  color:var(--mut);cursor:pointer;padding:9px 8px;border-radius:9px;white-space:nowrap;
}
.ghost:hover{color:var(--ink);}
.ghost[hidden]{display:none;}
.next{
  border:var(--bw) solid var(--navy);background:var(--yel);color:var(--navy);
  font:inherit;font-weight:800;font-size:15px;cursor:pointer;
  padding:12px 22px;border-radius:var(--r-md);box-shadow:4px 4px 0 var(--navy);
  transition:transform .09s var(--ease),box-shadow .09s var(--ease);white-space:nowrap;
}
.next:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--navy);}
.hint{margin:11px 0 0;text-align:center;color:#5F5D72;font-size:11.5px;font-weight:600;}
.counter{font-variant-numeric:tabular-nums;}

button:focus-visible,a:focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:10px;}
.plaque:focus,.plaque:focus-visible{outline:none;}

/* confete ------------------------------------------------------ */
.confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:9;}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg);opacity:.15;}}

.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

/* responsivo ---------------------------------------------------- */
@media (max-width:400px){
  .inner{padding:14px 16px 8px;}
  .cardfoot{padding:0 16px 13px;}
  .plaque{font-size:19px;padding:8px 14px;}
  .lead{font-size:13.8px;}
  .next{padding:11px 16px;font-size:14px;}
  .ghost{font-size:12.5px;padding:9px 5px;}
  .tagpill,.steppill{font-size:9.5px;}
  .sig .slog{font-size:10px;padding:5px 9px;}
  .grid{grid-template-columns:repeat(auto-fit,minmax(88px,1fr));}
}
@media (max-width:340px){
  .stats{grid-template-columns:1fr;}
  .grid{grid-template-columns:repeat(2,1fr);}
  .sig .slog{display:none;}
}
@media (min-width:760px){
  :root{--card-w:436px;}
  .plaque{font-size:22.5px;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>
<div class="dots-bg" aria-hidden="true"></div>
<div class="bgicons" id="bg" aria-hidden="true"></div>

<main class="stage">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="ttl-live" aria-describedby="hint">
    <h1 class="sr" id="ttl-live">Onboarding do Bora na Tech: Empresas</h1>

    <div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" aria-label="Progresso do onboarding" id="bar"><i id="barfill"></i></div>

    <div class="stack" id="stack"></div>

    <div class="foot">
      <div class="side">
        <button class="ghost" id="back" type="button" hidden>← Voltar</button>
        <button class="ghost" id="skip" type="button">Pular</button>
      </div>
      <button class="next" id="next" type="button">Próximo →</button>
    </div>

    <p class="hint" id="hint">arraste o card ou use as setas ← → · <span class="counter" id="counter"></span></p>
    <p class="sr" role="status" aria-live="polite" id="live"></p>

    <noscript>
      <p style="border:2px solid #0B1020;background:#fff;border-radius:14px;padding:14px;font-size:14px;">
        Este onboarding precisa de JavaScript ativado. Você pode ir direto para
        <a href="https://www.boranatech.com.br">a plataforma</a>.
      </p>
    </noscript>
  </section>
</main>

<script>
(() => {
"use strict";

/* ============================================================

const counter = document.getElementById('counter');

const state = { step:0, profile:null, tour:null, done:false };
const stripTags = (s) => String(s).replace(/<[^>]+>/g, '');

/* ícones fantasma no fundo do card, em posições fixas por índice */
const GHOSTS = [
  ['code',   6,  22, 44], ['braces', 88, 16, 40], ['term',   4,  55, 46],
  ['cloud',  86, 52, 52], ['cursor', 90, 78, 40], ['chart',  5,  80, 42],
  ['braces', 78, 34, 34]
];
function ghostLayer(){
  return GHOSTS.map(g =>
    `<span style="left:${g[1]}%;top:${g[2]}%">${svg(g[0], g[3], '#fff', 2)}</span>`).join('');
}
const SPARKS = [
  [84, 26, 15, '#FFC61E'], [13, 42, 13, '#fff'], [90, 62, 12, '#fff'],
  [10, 68, 14, '#FFC61E'], [80, 88, 11, '#fff']
];
function sparkLayer(){
  return SPARKS.map(s =>
    `<span style="left:${s[0]}%;top:${s[1]}%">${star(s[2], s[3])}</span>`).join('');
}

function heroFor(s){
  if (s.hero === 'logo') return `<div class="hero"><div class="ring" style="--hs:104px"><div class="coin">${logo(70)}</div></div></div>`;
  if (s.hero === 'icon') return `<div class="hero"><div class="ring" style="--hs:${s.heroSize||96}px">${svg(s.icon, Math.round((s.heroSize||96)*0.46), '#fff', 2.1)}</div></div>`;
  return '';
}

function midFor(s){
  let h = '';

  if (s.choices){
    h += `<div class="opts" role="radiogroup" aria-label="${stripTags(s.title)}">` +
      s.choices.map((o, k) =>
        `<button class="opt" type="button" role="radio" aria-checked="false" data-k="${k}">
           <span class="oic">${svg(o[0],22,'#0B1020',1.9)}</span>
           <span><b>${o[1]}</b><em>${o[2]}</em></span>
         </button>`).join('') + `</div>`;
  }

  if (s.points){
    h += `<ul class="points">` + s.points.map(p =>
      `<li data-prof="${p[3] === null || p[3] === undefined ? '' : p[3]}">
         <span class="s">${svg(p[0],19,'#0B1020',2)}</span>
         <div><b class="pt">${p[1]}<span class="tag" hidden>PRA VOCÊ</span></b><p>${p[2]}</p></div>
       </li>`).join('') + `</ul>`;
  }

  if (s.tools){
    h += `<div class="grid">` + s.tools.map(t =>
      `<div class="tool">${t[2] ? '<b class="pro">PRO</b>' : ''}${svg(t[0],21,'#0B1020',1.95)}<span>${t[1]}</span></div>`
    ).join('') + `</div>`;
  }

  if (s.stats){
    h += `<div class="stats">` + s.stats.map(t =>
      `<div class="stat"><b>${t[0]}</b><span>${t[1]}</span></div>`).join('') + `</div>`;
  }

  if (s.chips){
    h += `<div class="chips">` + s.chips.map(c =>
      `<span class="chip">${c[0]}</span>`).join('') + `</div>`;
  }

  if (s.price){
    h += `<div class="price"><div><b>${s.price[0]}</b><span>${s.price[1]}</span></div>${svg('lock',26,'#0B1020',2.2)}</div>`;
  }

  if (s.proCta){
    h += `<div class="proglow">
      <i class="s1">${star(13,'#FCC700')}</i><i class="s2">${star(10,'#fff')}</i>
      <i class="s3">${star(12,'#FCC700')}</i><i class="s4">${star(9,'#fff')}</i>
      <a class="procta" href="${s.proCta[1]}" target="_blank" rel="noopener">
        <span>${svg('spark',18,'#0B1020',2.3)}</span><span>${s.proCta[0]}</span><span>&rarr;</span>
      </a></div>`;
  }

  if (s.punch){
    h += `<div class="punch">${svg(s.punch[0],19,'#FCC700',2.1)}<span>${s.punch[1]}</span></div>`;
  }

  return h;
}

STEPS.forEach((s, i) => {
  const card = document.createElement('article');
  card.className = 'card';
  card.id = 'card-' + i;
  card.style.setProperty('--bg', s.bg);
  card.setAttribute('aria-label', `Passo ${i + 1} de ${STEPS.length}`);
  card.innerHTML =
    `<div class="gridbg" aria-hidden="true"></div>
     <div class="ghosts" aria-hidden="true">${ghostLayer()}</div>
     <div class="sparks" aria-hidden="true">${sparkLayer()}</div>

     <div class="top">
       <div class="brandbit">${logo(28)}<span class="tagpill">BORA NA TECH?</span></div>
       <span class="steppill"><i>${svg('check',10,'#FCC700',3)}</i>${i + 1} DE ${STEPS.length}</span>
     </div>

     <div class="inner">
       <p class="eyebrow">${s.eyebrow}</p>
       <h2 class="plaque" tabindex="-1" id="h-${i}">${s.title}</h2>
       ${heroFor(s)}
       <p class="lead">${s.lead}</p>
       ${midFor(s)}
     </div>

     <div class="cardfoot">
       <div class="dash" aria-hidden="true"><i></i>${star(13,'#FCC700')}<i></i></div>
       <div class="sig">
         <span class="who">${logo(22)}<b>BORA NA TECH?</b></span>
         <span class="slog">Sua bússola na TI</span>
       </div>
     </div>`;
  stack.appendChild(card);
});

const cards = [...stack.querySelectorAll('.card')];
barEl.setAttribute('aria-valuemax', String(STEPS.length));

/* ============================================================
   6. ESCOLHAS
   ============================================================ */
cards.forEach((card, idx) => {
  const group = card.querySelectorAll('.opt');
  group.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      group.forEach(o => o.setAttribute('aria-checked','false'));
      btn.setAttribute('aria-checked','true');
      const k = Number(btn.dataset.k);
      if (STEPS[idx].key === 'profile'){ state.profile = k; applyProfile(); }
      if (STEPS[idx].key === 'tour')   { state.tour = k === 0 ? 'guiado' : 'livre'; }
      emit('choice', { step:STEPS[idx].key, index:k, label:STEPS[idx].choices[k][1] });
      setTimeout(() => { if (idx < STEPS.length - 1) go(idx + 1); }, 300);
    });
    btn.addEventListener('keydown', (e) => {
      const list = [...group], at = list.indexOf(btn);
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight'){ e.preventDefault(); e.stopPropagation(); list[(at+1)%list.length].focus(); }
      if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); list[(at-1+list.length)%list.length].focus(); }
    });
  });
});

function applyProfile(){
  cards.forEach(card => {
    card.querySelectorAll('.points li').forEach(li => {
      const tag = li.querySelector('.tag');
      if (!tag) return;
      const v = li.dataset.prof;
      const match = v !== '' && Number(v) === state.profile;
      tag.hidden = !match;
      li.style.opacity = (v === '' || match) ? '1' : '.6';
    });
  });
}

/* ============================================================
   7. NAVEGAÇÃO
   ============================================================ */
let ro = null;
function measure(){ const h = cards[state.step].offsetHeight; if (h) stack.style.height = h + 'px'; }

function render(){
  const n = state.step;
  cards.forEach((c, i) => {
    c.className = 'card ' + (i < n ? 'gone' : i === n ? 'front' : i === n+1 ? 'b1' : i === n+2 ? 'b2' : 'hide');
    c.style.transform = '';
    const inactive = i !== n;
    c.setAttribute('aria-hidden', inactive ? 'true' : 'false');
    if ('inert' in c) c.inert = inactive;
    c.querySelectorAll('button').forEach(b => { b.tabIndex = inactive ? -1 : 0; });
  });

  barFill.style.width = ((n + 1) / STEPS.length) * 100 + '%';
  barEl.setAttribute('aria-valuenow', String(n + 1));
  counter.textContent = `${n + 1}/${STEPS.length}`;

  const last = n === STEPS.length - 1;
  btnNext.textContent = last ? (STEPS[n].cta || 'Começar') + ' →' : 'Próximo →';
  btnBack.hidden = n === 0;
  btnSkip.hidden = last;
  live.textContent = `Passo ${n + 1} de ${STEPS.length}: ${stripTags(STEPS[n].title)}`;

  if (ro) ro.disconnect();
  ro = new ResizeObserver(measure);
  ro.observe(cards[n]);
  measure();

  if (last && STEPS[n].finale) confetti();
}

function go(to, focus){
  const n = Math.max(0, Math.min(STEPS.length - 1, to));
  if (n === state.step) return;
  state.step = n;
  render();
  if (focus !== false){
    const h = cards[n].querySelector('.plaque');
    if (h) h.focus({ preventScroll:true });
  }
  if (window.scrollY > 4){
    const soft = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
    window.scrollTo({ top:0, behavior:soft });
  }
  emit('step', { index:n, key:STEPS[n].key });
}

btnNext.addEventListener('click', () => {
  if (state.step < STEPS.length - 1) go(state.step + 1); else finish('concluido');
});
btnBack.addEventListener('click', () => go(state.step - 1));
btnSkip.addEventListener('click', () => finish('pulado'));

document.addEventListener('keydown', (e) => {
  if (e.target.closest('.opt')) return;
  if (e.key === 'ArrowRight'){ e.preventDefault(); state.step < STEPS.length-1 ? go(state.step+1) : finish('concluido'); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(state.step - 1); }
  if (e.key === 'Escape')    { e.preventDefault(); finish('pulado'); }
});

/* ============================================================
   8. ARRASTE
   ============================================================ */
let dragging = false, startX = 0, startY = 0, axis = null, pid = null;
const THRESH = 68;

stack.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;
  dragging = true; axis = null; pid = e.pointerId;
  startX = e.clientX; startY = e.clientY;
  cards[state.step].classList.add('dragging');
});
stack.addEventListener('pointermove', (e) => {
  if (!dragging || e.pointerId !== pid) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (axis === null){
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (axis === 'x'){ try { stack.setPointerCapture(pid); } catch(_){} }
  }
  if (axis !== 'x') return;
  e.preventDefault();
  const limit = (state.step === 0 && dx > 0) || (state.step === STEPS.length-1 && dx < 0) ? .28 : 1;
  cards[state.step].style.transform = `translateX(${dx*limit}px) rotate(${dx*limit/36}deg)`;
});
function endDrag(e){
  if (!dragging || (e && e.pointerId !== pid)) return;
  dragging = false;
  const f = cards[state.step];
  f.classList.remove('dragging'); f.style.transform = '';
  if (axis !== 'x' || !e){ axis = null; return; }
  const dx = e.clientX - startX; axis = null;
  if (dx < -THRESH && state.step < STEPS.length-1) go(state.step + 1);
  else if (dx > THRESH && state.step > 0) go(state.step - 1);
}
stack.addEventListener('pointerup', endDrag);
stack.addEventListener('pointercancel', endDrag);
window.addEventListener('blur', () => endDrag(null));

/* ============================================================
   9. CONFETE
   ============================================================ */
let confettiDone = false;
function confetti(){
  if (confettiDone || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  confettiDone = true;
  const box = document.createElement('div');
  box.className = 'confetti'; box.setAttribute('aria-hidden','true');
  const cols = ['#FCC700','#F25CA2','#6D28D9','#15803D','#1D4ED8','#E5252F'];
  let h = '';
  for (let i = 0; i < 46; i++){
    h += `<i style="left:${rnd(0,100).toFixed(1)}%;background:${cols[i%cols.length]};animation-duration:${rnd(2.2,4.4).toFixed(2)}s;animation-delay:${rnd(0,.6).toFixed(2)}s;transform:rotate(${(rnd(0,360)|0)}deg)"></i>`;
  }
  box.innerHTML = h;
  document.querySelector('.stage').appendChild(box);
  setTimeout(() => box.remove(), 5600);
}

/* ============================================================
   10. SAIDA: API
   ============================================================ */
const PROFILES = ['nao-sei-nada','sei-mas-e-agora','ja-estou-na-area'];

function emit(type, detail){
  const payload = { source:'bnt-onboarding', screen:'empresas', type, ...detail };
  window.dispatchEvent(new CustomEvent('bnt:onboarding', { detail:payload }));
  try { if (window.parent !== window) window.parent.postMessage(payload, '*'); } catch(_){}
}

function finish(how){
  if (state.done) return;
  state.done = true;
  const result = {
    completed: how === 'concluido',
    perfil: state.profile === null ? null : PROFILES[state.profile],
    tour: state.tour
  };
  emit('finish', { how, result });
  console.log('[Bora na Tech] onboarding finalizado:', how, result);
  btnNext.textContent = how === 'concluido' ? 'Tudo pronto ✓' : 'Onboarding pulado';
  btnNext.disabled = true; btnSkip.hidden = true;
  setTimeout(() => { state.done = false; btnNext.disabled = false; render(); }, 1600);
}

window.BNTOnboarding = {
  get step(){ return state.step; },
  get total(){ return STEPS.length; },
  get data(){ return { perfil: state.profile === null ? null : PROFILES[state.profile], tour: state.tour }; },
  next(){ go(state.step + 1); },
  prev(){ go(state.step - 1); },
  goTo(n){ go(n); },
  restart(){ state.step = 0; state.profile = null; state.tour = null; confettiDone = false;
             cards.forEach(c => c.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-checked','false')));
             applyProfile(); render(); }
};

/* ============================================================
   11. BOOT
   ============================================================ */
window.addEventListener('resize', measure, { passive:true });
document.fonts && document.fonts.ready.then(measure).catch(() => {});
render();

})();
</script>
